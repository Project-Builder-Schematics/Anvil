pre-commit:
  commands:
    affected:
      run: bunx nx affected -t lint typecheck --base=HEAD
    tools:
      glob: 'tools/**/*.ts'
      run: bun run check:tools
    schematics:
      glob: 'schematics/**/*.ts'
      run: bun run check:schematics
commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
