# Shared infra (db, pgadmin) runs in project "anvil"; each worktree runs only `api` in its own project.
# Published ports are bound to 127.0.0.1; defaults are documented in .env.example.
# `bun run dev` creates the external network and starts everything in the right order.
services:
  db:
    image: postgres:17.11
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: anvil
      POSTGRES_USER: ${DB_USER:-anvil}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      shared:
        aliases: [db]

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-demo}
    networks: [shared]

  api:
    image: oven/bun:1.3.14
    working_dir: /repo
    # The inspector must listen on a non-loopback address: Docker forwards the published port to the container's own
    # address, so a 127.0.0.1 bind would refuse the host. It has no authentication; it is reachable from the host only
    # through 127.0.0.1 and from the containers on anvil-shared-net (db, pgadmin, the other worktrees' api).
    # node_modules lives in a volume so the container installs its own Linux binaries and the host's stay intact.
    # Bun reads the tsconfig of its working directory, not the one nearest each file, and --tsconfig-override does not
    # bring in experimentalDecorators, so the API runs from apps/api or Nest's legacy decorators break at startup.
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && cd apps/api && exec bun --inspect=0.0.0.0:9229 --watch src/main.ts
    volumes:
      - .:/repo
      - node-modules:/repo/node_modules
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
      - '127.0.0.1:${DEBUG_PORT:-9229}:9229'
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-anvil}
      DB_USER: ${DB_USER:-anvil}
      DB_PASSWORD: ${DB_PASSWORD:-demo}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    networks: [shared]

  web:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-4200}:80'
    networks: [shared]

volumes:
  db-data:
  node-modules:

networks:
  shared:
    name: anvil-shared-net
    external: true
