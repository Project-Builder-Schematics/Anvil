name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      - run: bunx nx format:check
      - run: bunx nx affected -t lint typecheck test
      - run: bun run check:tools
      - run: bun run check:schematics
